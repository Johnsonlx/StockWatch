<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>StockWatch — Trades</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;transition:background .3s,color .3s}
a{color:var(--acc);text-decoration:none}

/* Themes (same as main) */
[data-theme="dark"]{--bg:#0A2647;--sur:#0f2d52;--card:#144272;--cb:#205295;--hov:#1a3a65;--acc:#2C74B3;--adim:rgba(44,116,179,.20);--pos:#00e676;--pbg:rgba(0,230,118,.10);--neg:#ff4d6a;--nbg:rgba(255,77,106,.10);--gld:#ffc740;--gbg:rgba(255,199,64,.12);--tx:#d8e8f8;--sub:#6a95be;--mut:#2a4a6e;--shd:rgba(0,0,0,.55)}
[data-theme="ocean"]{--bg:#1a2130;--sur:#222b3d;--card:#28354a;--cb:#354660;--hov:#2e3d55;--acc:#00b4d8;--adim:rgba(0,180,216,.18);--pos:#56d18a;--pbg:rgba(86,209,138,.10);--neg:#ff6b88;--nbg:rgba(255,107,136,.10);--gld:#f6c90e;--gbg:rgba(246,201,14,.12);--tx:#dce8f0;--sub:#6e8fa8;--mut:#364a5e;--shd:rgba(0,0,0,.5)}
[data-theme="lavender"]{--bg:#EEF1FF;--sur:#D2DAFF;--card:#ffffff;--cb:#AAC4FF;--hov:#c3cfff;--acc:#6366f1;--adim:rgba(99,102,241,.12);--pos:#2d7a2d;--pbg:rgba(45,122,45,.08);--neg:#c0392b;--nbg:rgba(192,57,43,.08);--gld:#b8860b;--gbg:rgba(184,134,11,.10);--tx:#1e1e3a;--sub:#6a6aa0;--mut:#B1B2FF;--shd:rgba(99,102,241,.12)}
[data-theme="mint"]{--bg:#EEE9DA;--sur:#BDCDD6;--card:#ffffff;--cb:#93BFCF;--hov:#adc5cf;--acc:#6096B4;--adim:rgba(96,150,180,.14);--pos:#2a7a4f;--pbg:rgba(42,122,79,.08);--neg:#b83232;--nbg:rgba(184,50,50,.08);--gld:#9a7010;--gbg:rgba(154,112,16,.10);--tx:#1a2e30;--sub:#4a7080;--mut:#93BFCF;--shd:rgba(96,150,180,.15)}
[data-theme="earth"]{--bg:#F8EDE3;--sur:#BDD2B6;--card:#ffffff;--cb:#A2B29F;--hov:#b0c3a9;--acc:#798777;--adim:rgba(121,135,119,.14);--pos:#3d7a3d;--pbg:rgba(61,122,61,.08);--neg:#a83232;--nbg:rgba(168,50,50,.08);--gld:#8a6a10;--gbg:rgba(138,106,16,.10);--tx:#2a2520;--sub:#5a6055;--mut:#A2B29F;--shd:rgba(121,135,119,.15)}

.wrap{max-width:960px;margin:0 auto;padding:20px 16px 60px}

/* Header */
.hdr{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:28px;flex-wrap:wrap}
.hdr-left{display:flex;align-items:center;gap:12px}
.hdr-ico{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--acc),var(--adim));display:flex;align-items:center;justify-content:center;font-size:1.1rem;color:#fff}
.hdr h1{font-size:1.3rem;font-weight:800;letter-spacing:-.3px}
.hdr-sub{font-size:.78rem;color:var(--sub);margin-top:2px}
.back-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:9px;background:var(--adim);border:1px solid var(--acc);color:var(--acc);font-size:.8rem;font-weight:600;cursor:pointer;transition:all .15s;text-decoration:none}
.back-btn:hover{background:var(--acc);color:#fff}

/* Summary cards */
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:24px}
.sc{background:var(--sur);border:1px solid var(--cb);border-radius:13px;padding:16px;text-align:center}
.sc-lbl{font-size:.66rem;text-transform:uppercase;letter-spacing:.08em;color:var(--sub);font-weight:700;margin-bottom:6px}
.sc-val{font-family:'JetBrains Mono',monospace;font-size:1.1rem;font-weight:800}
.sc-val.p{color:var(--pos)}.sc-val.n{color:var(--neg)}.sc-val.a{color:var(--acc)}.sc-val.g{color:var(--gld)}

/* Filter tabs */
.tabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.tab{padding:7px 14px;border-radius:8px;font-size:.78rem;font-weight:600;border:1px solid var(--cb);background:var(--card);color:var(--sub);cursor:pointer;transition:all .15s}
.tab.on{background:var(--adim);border-color:var(--acc);color:var(--acc)}

/* Trade list */
.tl{display:flex;flex-direction:column;gap:10px}
.tc{background:var(--card);border:1px solid var(--cb);border-radius:14px;padding:16px 18px;transition:border-color .2s}
.tc:hover{border-color:var(--acc)}
.tc-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.tc-sym{font-family:'JetBrains Mono',monospace;font-size:1rem;font-weight:800}
.tc-name{font-size:.72rem;color:var(--sub)}
.tc-badge{font-size:.7rem;font-weight:700;padding:3px 10px;border-radius:6px;font-family:'JetBrains Mono',monospace}
.tc-badge.sell{background:var(--pbg);color:var(--pos);border:1px solid var(--pos)}
.tc-badge.close{background:var(--gbg);color:var(--gld);border:1px solid var(--gld)}
.tc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:10px}
.tc-item{}
.tc-lbl{font-size:.64rem;text-transform:uppercase;letter-spacing:.07em;color:var(--sub);font-weight:600;margin-bottom:3px}
.tc-v{font-family:'JetBrains Mono',monospace;font-size:.88rem;font-weight:700}
.tc-pl{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:5px;font-family:'JetBrains Mono',monospace;font-size:.78rem;font-weight:700;margin-top:8px}
.tc-pl.p{color:var(--pos);background:var(--pbg)}.tc-pl.n{color:var(--neg);background:var(--nbg)}

/* Closed position details */
.tc-details{margin-top:12px;padding-top:12px;border-top:1px solid var(--cb);font-size:.75rem;color:var(--sub);line-height:1.6}

/* Empty state */
.empty{text-align:center;padding:60px 20px;color:var(--sub)}
.empty i{font-size:2.5rem;margin-bottom:14px;color:var(--mut)}
.empty p{font-size:.9rem}

@media(max-width:600px){
  .hdr h1{font-size:1.1rem}
  .tc-grid{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="hdr">
    <div class="hdr-left">
      <div class="hdr-ico"><i class="fa-solid fa-arrow-right-arrow-left"></i></div>
      <div>
        <h1>Trades-Dashboard</h1>
        <div class="hdr-sub">Alle Verkäufe & geschlossene Positionen</div>
      </div>
    </div>
    <a href="stockwatch_beta.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Zum Portfolio</a>
  </div>

  <div class="sum" id="summary"></div>

  <div class="tabs" id="tabs">
    <div class="tab on" data-f="all" onclick="setFilter('all',this)">Alle</div>
    <div class="tab" data-f="sell" onclick="setFilter('sell',this)">Verkäufe</div>
    <div class="tab" data-f="close" onclick="setFilter('close',this)">Geschlossene</div>
    <div class="tab" data-f="profit" onclick="setFilter('profit',this)">Gewinne</div>
    <div class="tab" data-f="loss" onclick="setFilter('loss',this)">Verluste</div>
  </div>

  <div class="tl" id="tradeList"></div>
</div>

<script>
// Apply theme from main app
const theme = localStorage.getItem('sw_theme')||'dark';
document.documentElement.setAttribute('data-theme', theme);

const f2 = n => n.toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2});
const fDate = d => d ? new Date(d+'T12:00:00').toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'}) : '—';

let currentFilter = 'all';

function getTradeLog() { return JSON.parse(localStorage.getItem('sw_trades')||'[]'); }

// Also get active sales from portfolio
function getActiveSales() {
  const portfolio = JSON.parse(localStorage.getItem('sw_p')||'[]');
  const sales = [];
  portfolio.forEach(s => {
    (s.sales||[]).forEach(sl => {
      sales.push({
        id: sl.id, type: 'sell',
        symbol: s.symbol, name: s.name||s.symbol,
        currency: s.currency||'',
        shares: sl.shares,
        price: sl.sellPrice,
        avgBuyPrice: sl.avgBuyPrice,
        date: sl.sellDate,
        time: sl.sellTime||'',
        realizedPL: sl.realizedPL || (sl.sellPrice - sl.avgBuyPrice) * sl.shares,
        timestamp: new Date(sl.sellDate+'T12:00:00').getTime()
      });
    });
  });
  return sales;
}

function getAllTrades() {
  const log = getTradeLog();
  const active = getActiveSales();
  // Merge, deduplicate by id
  const ids = new Set(log.map(t=>t.id));
  const merged = [...log];
  active.forEach(a => { if(!ids.has(a.id)) merged.push(a); });
  // Sort by date desc
  merged.sort((a,b) => (b.timestamp||0) - (a.timestamp||0));
  return merged;
}

function renderSummary(trades) {
  const sells = trades.filter(t=>t.type==='sell');
  const closed = trades.filter(t=>t.type==='position_closed');
  const totalPL = sells.reduce((a,t)=>a+(t.realizedPL||0),0) + closed.reduce((a,t)=>a+(t.totalRealized||0),0);
  const winners = sells.filter(t=>(t.realizedPL||0)>=0).length + closed.filter(t=>(t.totalRealized||0)>=0).length;
  const losers = sells.filter(t=>(t.realizedPL||0)<0).length + closed.filter(t=>(t.totalRealized||0)<0).length;
  const totalTrades = sells.length + closed.length;

  document.getElementById('summary').innerHTML = `
    <div class="sc"><div class="sc-lbl">Realisierter G/V</div><div class="sc-val ${totalPL>=0?'p':'n'}">${totalPL>=0?'+':''}${f2(totalPL)} €</div></div>
    <div class="sc"><div class="sc-lbl">Trades gesamt</div><div class="sc-val a">${totalTrades}</div></div>
    <div class="sc"><div class="sc-lbl">Gewinner</div><div class="sc-val p">${winners}</div></div>
    <div class="sc"><div class="sc-lbl">Verlierer</div><div class="sc-val n">${losers}</div></div>
    <div class="sc"><div class="sc-lbl">Trefferquote</div><div class="sc-val g">${totalTrades?Math.round(winners/totalTrades*100)+'%':'—'}</div></div>
  `;
}

function renderTrades(trades) {
  const el = document.getElementById('tradeList');
  let filtered = trades;
  if(currentFilter==='sell') filtered = trades.filter(t=>t.type==='sell');
  if(currentFilter==='close') filtered = trades.filter(t=>t.type==='position_closed');
  if(currentFilter==='profit') filtered = trades.filter(t=>(t.realizedPL||t.totalRealized||0)>=0 && t.type!=='buy');
  if(currentFilter==='loss') filtered = trades.filter(t=>(t.realizedPL||t.totalRealized||0)<0 && t.type!=='buy');

  if(!filtered.length) {
    el.innerHTML = `<div class="empty"><i class="fa-solid fa-inbox"></i><p>Keine Trades vorhanden.</p></div>`;
    return;
  }

  el.innerHTML = filtered.map(t => {
    if(t.type === 'position_closed') {
      const pl = t.totalRealized||0;
      const plC = pl>=0?'p':'n';
      const buyCount = (t.purchases||[]).length;
      const sellCount = (t.sales||[]).length;
      return `<div class="tc" style="border-left:3px solid ${pl>=0?'var(--pos)':'var(--neg)'}">
        <div class="tc-head">
          <div><div class="tc-sym">${t.symbol}</div><div class="tc-name">${t.name} · Position geschlossen</div></div>
          <div class="tc-badge close"><i class="fa-solid fa-flag-checkered"></i> Closed</div>
        </div>
        <div class="tc-grid">
          <div class="tc-item"><div class="tc-lbl">Investiert</div><div class="tc-v">${f2(t.totalInvested||0)} ${t.currency}</div></div>
          <div class="tc-item"><div class="tc-lbl">Stücke</div><div class="tc-v">${t.totalBought||0}</div></div>
          <div class="tc-item"><div class="tc-lbl">Zielpreis</div><div class="tc-v">${t.targetPrice?f2(t.targetPrice)+' '+t.currency:'—'}</div></div>
          <div class="tc-item"><div class="tc-lbl">Ziel erreicht</div><div class="tc-v" style="color:${t.targetReached?'var(--gld)':'var(--sub)'}">${t.targetReached?'✓ Ja':'Nein'}</div></div>
        </div>
        <div class="tc-pl ${plC}"><i class="fa-solid fa-${pl>=0?'arrow-trend-up':'arrow-trend-down'}"></i> ${pl>=0?'+':''}${f2(pl)} ${t.currency}</div>
        <div class="tc-details">${buyCount} Käufe · ${sellCount} Verkäufe · Geschlossen am ${new Date(t.timestamp).toLocaleDateString('de-DE')}</div>
      </div>`;
    }

    if(t.type === 'sell') {
      const pl = t.realizedPL||0;
      const plC = pl>=0?'p':'n';
      const pct = t.avgBuyPrice ? ((t.price-t.avgBuyPrice)/t.avgBuyPrice*100) : 0;
      return `<div class="tc" style="border-left:3px solid ${pl>=0?'var(--pos)':'var(--neg)'}">
        <div class="tc-head">
          <div><div class="tc-sym">${t.symbol}</div><div class="tc-name">${t.name||''} · ${fDate(t.date)}${t.time?' '+t.time:''}</div></div>
          <div class="tc-badge sell"><i class="fa-solid fa-hand-holding-dollar"></i> Verkauf</div>
        </div>
        <div class="tc-grid">
          <div class="tc-item"><div class="tc-lbl">Verkaufspreis</div><div class="tc-v">${f2(t.price)} ${t.currency}</div></div>
          <div class="tc-item"><div class="tc-lbl">Ø Einkauf</div><div class="tc-v">${f2(t.avgBuyPrice||0)} ${t.currency}</div></div>
          <div class="tc-item"><div class="tc-lbl">Stücke</div><div class="tc-v">${t.shares}</div></div>
          <div class="tc-item"><div class="tc-lbl">Erlös</div><div class="tc-v">${f2(t.price*t.shares)} ${t.currency}</div></div>
        </div>
        <div class="tc-pl ${plC}"><i class="fa-solid fa-${pl>=0?'arrow-trend-up':'arrow-trend-down'}"></i> ${pl>=0?'+':''}${f2(pl)} ${t.currency} (${pct>=0?'+':''}${pct.toFixed(2)}%)</div>
      </div>`;
    }

    return '';
  }).join('');
}

function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));
  btn.classList.add('on');
  renderTrades(getAllTrades());
}

// Init
const allTrades = getAllTrades();
renderSummary(allTrades);
renderTrades(allTrades);
</script>
</body>
</html>
